name: CI & Deploy to CapRover

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  ci:
    name: Lint & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Prettier & ESLint)
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          PUBLIC_POCKETBASE_URL: http://127.0.0.1:8090
          POCKETBASE_EMAIL: ci@example.com
          POCKETBASE_PASSWORD: ci-dummy-password

  deploy:
    name: Deploy to CapRover
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: tar --exclude='./deploy.tar' --exclude='./.git' -cf deploy.tar .

      - name: Deploy App to CapRover
        uses: caprover/deploy-from-github@v1.0.1
        with:
          server: 'c.rbnu.nl'
          app: 'bsg-gggg'
          token: '${{ secrets.APP_TOKEN }}'
